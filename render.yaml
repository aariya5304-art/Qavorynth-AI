# Render Blueprint: free web service for the API. The frontend deploys separately (Vercel/Netlify/Cloudflare Pages).
services:
  - type: web
    name: qavorynth-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: CORS_ORIGINS
        sync: false   # set to your frontend URL, e.g. https://qavorynth.vercel.app
